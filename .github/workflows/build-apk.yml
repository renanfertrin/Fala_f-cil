name: Gerar APK do FalaFácil

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Separar os arquivos do app
        run: |
          mkdir www
          cp index.html styles.css script.js versao.js sw.js manifest.webmanifest icone-urso-*.png fundo-*.svg urso.svg www/
          cp -r audio imagens www/

      - name: Instalar Capacitor
        run: npm install --legacy-peer-deps

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissões (câmera e microfone) e ícone do ursinho
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icones-android/* android/app/src/main/res/

      - name: Numero da versao do app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          echo "window.FF_VERSAO=\"1.${{ github.run_number }}\";" > www/versao.js
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Sincronizar
        run: npx cap sync android

      - name: Assinatura fixa do app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "ERRO: o segredo KEYSTORE_BASE64 nao existe ou esta vazio. Crie-o em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FalaFacil.apk

      - name: Mostrar assinatura do APK
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $AS verify --print-certs FalaFacil.apk | grep -i "SHA-256"

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: FalaFácil para Android (versão ${{ github.run_number }})
          body: "Baixe o arquivo FalaFacil.apk abaixo e instale no celular Android."
          files: FalaFacil.apk
