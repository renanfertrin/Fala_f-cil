name: Gerar APK do FalaFácil

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Separar os arquivos do app
        run: |
          mkdir www
          cp index.html styles.css script.js sw.js manifest.webmanifest icone-urso-*.png fundo-*.svg urso.svg www/
          cp -r audio imagens www/

      - name: Instalar Capacitor
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissão da câmera e ícone do ursinho
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icones-android/* android/app/src/main/res/

      - name: Sincronizar
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FalaFacil.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: FalaFácil para Android (versão ${{ github.run_number }})
          body: "Baixe o arquivo FalaFacil.apk abaixo e instale no celular Android."
          files: FalaFacil.apk
