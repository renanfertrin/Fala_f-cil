<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3cff">
<title>FalaFácil</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-urso-192.png">
<link rel="apple-touch-icon" href="icone-urso-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="tema-menino">
<div class="app-container">
  <div class="header-title" id="titulo">FalaFácil</div>

  <section id="tela-alunos" class="tela">
    <p class="texto">Quem vai usar o FalaFácil?</p>
    <div id="lista-alunos" class="lista"></div>
    <div class="novo">
      <input id="nome" type="text" placeholder="Nome do aluno" maxlength="30" autocomplete="off">
      <div class="seletor" role="group" aria-label="Menino ou menina">
        <button type="button" class="seletor-btn" data-genero="menino" aria-pressed="true">Menino</button>
        <button type="button" class="seletor-btn" data-genero="menina" aria-pressed="false">Menina</button>
      </div>
      <button type="button" id="criar" class="acao">Adicionar aluno</button>
    </div>
  </section>

  <section id="tela-aluno" class="tela" hidden>
    <div class="barra">
      <button type="button" id="voltar" class="acao">Trocar aluno</button>
      <button type="button" id="editar" class="acao" aria-pressed="false">Editar fotos</button>
      <button type="button" id="add-card" class="acao">Adicionar card</button>
      <button type="button" id="organizar" class="acao" aria-pressed="false">Organizar</button>
    </div>
    <p id="aviso" class="texto" hidden>Toque em um quadrado para trocar a foto.</p>
    <div id="grade" class="grade"></div>
    <button type="button" id="excluir" class="acao perigo" hidden>Excluir aluno</button>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dlg-titulo"></h2>
  <label class="acao">Tirar foto<input type="file" id="f-cam" accept="image/*" capture="environment" hidden></label>
  <label class="acao">Escolher da galeria<input type="file" id="f-gal" accept="image/*" hidden></label>
  <button type="button" id="padrao" class="acao">Usar imagem padrão</button>
  <button type="button" id="fechar" class="acao">Cancelar</button>
</dialog>
<dialog id="dlg-card">
  <h2 id="dc-titulo">Novo card</h2>
  <input id="c-nome" type="text" placeholder="Nome (ex.: LANCHE)" maxlength="16" autocomplete="off">
  <img id="c-prev" alt="Foto do card" hidden>
  <label class="acao">Tirar foto<input type="file" id="c-cam" accept="image/*" capture="environment" hidden></label>
  <label class="acao">Escolher da galeria<input type="file" id="c-gal" accept="image/*" hidden></label>
  <p class="dica">Áudio do card</p>
  <div class="modos">
    <button type="button" class="modo-btn" data-modo="nenhum">Sem áudio</button>
    <button type="button" class="modo-btn" data-modo="gravado">Áudio</button>
    <button type="button" class="modo-btn" data-modo="texto">Texto</button>
  </div>
  <div id="sec-gravar" hidden>
    <label class="acao">Escolher arquivo de áudio<input type="file" id="c-arq" accept="audio/*" hidden></label>
    <button type="button" id="btn-gravar" class="acao">● Gravar</button>
    <button type="button" id="btn-ouvir" class="acao" hidden>▶ Ouvir gravação</button>
  </div>
  <div id="sec-texto" hidden>
    <textarea id="c-texto" rows="3" maxlength="140" placeholder="Digite o que o aplicativo deve falar"></textarea>
    <button type="button" id="btn-falar" class="acao">▶ Ouvir a voz</button>
  </div>
  <button type="button" id="c-salvar" class="acao">Salvar card</button>
  <button type="button" id="c-excluir" class="acao" hidden>Excluir card</button>
  <button type="button" id="c-fechar" class="acao">Cancelar</button>
</dialog>
<script src="script.js"></script>
</body>
</html>
